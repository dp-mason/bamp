blendamp:
  background.png:
    eq_background:
      region: [0, 116, 275, 232]
      dest: "eqmain.bmp"
    playlist_bottom_left_menu:
      region: [0, 310, 125, 348]
      dest: "Pledit.bmp"
    playlist_bottom_right_menu:
      region: [125, 310, 275, 348]
      dest: "Pledit.bmp"

  # In the blendamp parameter layers, there is a layer for each individual frame used in the ui
  # Ex. A volume bar with 28 different backgrounds based on volume level will appear
  # in the same region across 28 sequential layers to make animation design easier
  # This also includes buttons with multiple states
  # param_based_layers:
  #   # Backgrounds
  #   player_volume_bar: []
  #   player_progress_bar: []
  #   player_panning_bar: []
  #   eq_volume_bar: []
  #   eq_band_bar: []
  #   # Elements with State
  #   # Normal vs Pressed
  #   main_player_buttons: []
  #   # Header Bars
  #   main_player_header: []

winamp:
  AVS.bmp:
    resolution: [97, 188]
  Pledit.bmp:
    resolution: [280, 186]
    playlist_bottom_left_menu: [0, 72, 125, 110]
    playlist_bottom_right_menu: [126, 72, 275, 110]
    tl_corner: []
    tr_corner: []
    repeated_top_sect: []
    repeated_b_sect: []
    expanded_b_sect: []
    repeated_r_sect: []
    repeated_l_sect: []
    scroll_bar: []
    scroll_bar_pressed: []
  balance.bmp:
    resolution: [68, 433]
  cbuttons.bmp:
    resolution: [136, 36]
    buttons_norm: [0, 0, 114, 18]
    buttons_pressed: [0, 18, 114, 35]
    eject_button_norm: [114, 0, 135, 16]
    eject_button_pressed: [114, 16, 135, 32]
  eq_ex.bmp:
    resolution: [275, 82]
  eqmain.bmp:
    resolution: [275, 315]
    eq_background: [0, 0, 275, 116]
    eq_handle: []
    eq_handle_pressed: []
    on: []
    off: []
    eq_viz_bg: []
    eq_viz_spectrum: [115, 294, 116, 313]
    # 28 regions representing the highest and lowest state
    vol_bg_spectrum:
      dimensions: []
      gap: -999

  main.bmp:
    resolution: [275, 116]
    player_bg: [0, 0, 275, 116]
  mb.bmp:
    resolution: [242, 119]
  monoster.bmp:
    resolution: [58, 24]
  nums_ex.bmp:
    resolution: [108, 13]
  playpaus.bmp:
    resolution: [42, 9]
  posbar.bmp:
    resolution: [307, 10]
    posbar_bg: []
    posbar_handle: []
    posbar_handle_pressed: []
  shufrep.bmp:
    resolution: [92, 85]
    shuf_off: []
    shuf_on: []
    rep_off: []
    rep_on: []
    eq_off: []
    eq_on: []
    pl_off: []
    pl_on: []
  text.bmp:
    resolution: [155, 18]
    letter_res: [5, 6]
  titlebar.bmp:
    resolution: [344, 87]
  # Special case
  volume.bmp:
    resolution: [68, 433]
    vol_frame_res: [68, 13]
    vertical_gap: 2
    vol_handle: [0, 422, 14, 433]
    vol_handle_pressed: [15, 422, 29, 433]
