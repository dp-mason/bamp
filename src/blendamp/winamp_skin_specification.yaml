text_extras:
  COLOR_SAMPLE_SIZE: 12
  PLEDIT_START: [125, 80]
  CHAR_WIDTH: 5
  CHAR_HEIGHT: 6
  VISCOLOR_TOTAL: 24
  VISCOLOR_START: [0, 35]
  VISCOLOR_COMMENTS:
    - "// color 0 - (background color #1)"
    - "// color 1 - (background color #2)"
    - "// 2 - top of spectrum visualizer"
    - "// 3"
    - "// 4"
    - "// 5"
    - "// 6"
    - "// 7"
    - "// 8"
    - "// 9"
    - "// 10 = mid of spec"
    - "// 11"
    - "// 12"
    - "// 13"
    - "// 14"
    - "// 15"
    - "// 16"
    - "// 17 = bottom of spec"
    - "// 18 = osc 1 (brightest)"
    - "// 19 = osc 2 (slightly dimmer)"
    - "// 20 = osc 3"
    - "// 21 = osc 4"
    - "// 22 = osc 5 (dimmest)"
    - "// 23 = spectrum analyzer peak dots"
  PLEDIT_FONT: "Arial" # Maybe we could decide a list of acceptable fonts?
  PLEDIT_FIELDS:
    - "Normal"
    - "Current"
    - "NormalBG"
    - "SelectedBG"
    - "mbBG"
    - "mbFG"
    - "Font"
  CHAR_POSITIONS:
    A: [0, 0]
    B: [5, 0]
    C: [10, 0]
    D: [15, 0]
    E: [20, 0]
    F: [25, 0]
    G: [30, 0]
    H: [35, 0]
    I: [40, 0]
    J: [45, 0]
    K: [50, 0]
    L: [55, 0]
    M: [60, 0]
    N: [65, 0]
    O: [70, 0]
    P: [75, 0]
    Q: [80, 0]
    R: [85, 0]
    S: [90, 0]
    T: [95, 0]
    U: [100, 0]
    V: [105, 0]
    W: [110, 0]
    X: [115, 0]
    Y: [120, 0]
    Z: [125, 0]
    \": [130, 0]
    "@": [135, 0]
    "0": [0, 6]
    "1": [5, 6]
    "2": [10, 6]
    "3": [15, 6]
    "4": [20, 6]
    "5": [25, 6]
    "6": [30, 6]
    "7": [35, 6]
    "8": [40, 6]
    "9": [45, 6]
    "...": [50, 6]
    ".": [55, 6]
    "=": [140, 6]
    "(": [65, 6]
    ")": [70, 6]
    "-": [75, 6]
    \': [80, 6]
    "!": [85, 6]
    "_": [90, 6]
